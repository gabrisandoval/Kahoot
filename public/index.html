<!DOCTYPE html>
<html lang="it">
<head><meta charset="UTF-8"><title>Test Socket.IO</title></head>
<body>
<h1 id="status">Connessione in corso...</h1>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();

    socket.on('connect', () => {
        document.getElementById('status').innerText = 'Connesso al server! ID: ' + socket.id;
    });
</script>
</body>
</html>
