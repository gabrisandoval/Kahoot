<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gioca</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="player-page">
    <div id="joinScreen" style="flex:1; display:flex; flex-direction:column; justify-content:center; padding:16px 12px; width:100%; box-sizing:border-box;">
        <h1 style="font-family:var(--font-display); font-size:clamp(40px,14vw,72px); text-align:center; margin-bottom:32px; line-height:1.05;">Entra nel quiz</h1>
        <div class="join-form" style="width:100%;">
            <input id="pinInput" placeholder="PIN" style="width:100%; box-sizing:border-box; font-size:clamp(48px,20vw,90px); text-align:center; letter-spacing:6px; padding:28px 8px; font-family:var(--font-display); font-weight:700;">
            <input id="nicknameInput" placeholder="Il tuo nome" style="width:100%; box-sizing:border-box; font-size:clamp(26px,8vw,36px); padding:26px 22px;">
            <button class="btn btn-accent" style="width:100%; box-sizing:border-box; font-size:clamp(26px,8vw,36px); padding:26px 12px;" onclick="joinRoom()">Entra</button>
        </div>
        <p id="message" style="color:var(--coral); font-weight:600; text-align:center; font-size:clamp(18px,5vw,24px);"></p>
    </div>

    <div id="question" class="options-grid"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let currentPin = null;

    const urlParams = new URLSearchParams(window.location.search);
    const pinFromUrl = urlParams.get('pin');
    if (pinFromUrl) {
        document.getElementById('pinInput').value = pinFromUrl;
    }

    function joinRoom() {
        const pin = document.getElementById('pinInput').value.trim();
        const nickname = document.getElementById('nicknameInput').value.trim();

        if (!pin || !nickname) {
            document.getElementById('message').innerText = 'Inserisci PIN e nome';
            return;
        }

        socket.emit('player-join', { pin, nickname });
    }

    socket.on('join-success', ({ pin, nickname }) => {
        currentPin = pin;
        document.getElementById('joinScreen').innerHTML =
            '<div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:16px;">' +
            '<h1 style="font-family:var(--font-display); font-size:clamp(56px,20vw,100px); line-height:1.0; margin-bottom:24px;">Ciao ' + nickname + '!</h1>' +
            '<p style="font-size:clamp(28px,9vw,42px); opacity:.75; max-width:90%;">In attesa che l\'host avvii la domanda...</p>' +
            '</div>';
    });

    socket.on('join-error', (msg) => {
        document.getElementById('message').innerText = msg;
    });

    const shapes = ['▲', '◆', '●', '■'];

    let pendingResult = null;
    let timeIsUp = false;
    let playerCountdown = null;

    socket.on('new-question', ({ options, timeLimit }) => {
        document.getElementById('joinScreen').style.display = 'none';

        pendingResult = null;
        timeIsUp = false;
        clearInterval(playerCountdown);

        const html = options.map((o, i) =>
            '<button class="option-btn option-' + i + '" onclick="submitAnswer(' + i + ')"><span class="shape" style="font-size:3em;">' + shapes[i] + '</span></button>'
        ).join('');
        document.getElementById('question').innerHTML = html;

        // NUOVO: il countdown gira ancora "in silenzio", senza elemento visibile
        let remaining = timeLimit;

        playerCountdown = setInterval(() => {
            remaining--;

            if (remaining <= 0) {
                clearInterval(playerCountdown);
                document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
                timeIsUp = true;
                revealResult();
            }
        }, 1000);
    });

    function submitAnswer(index) {
        //clearInterval(playerCountdown);
        socket.emit('submit-answer', { pin: currentPin, answerIndex: index });

        // NUOVO: sostituisce le opzioni con il messaggio di attesa
        document.getElementById('question').innerHTML =
            '<div style="grid-column:1/-1; display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:70vh; text-align:center; padding:16px;">' +
            '<p style="font-family:var(--font-display); font-size:clamp(28px,8vw,44px); opacity:.75;">Hai risposto!</p>' +
            '<p style="font-size:clamp(18px,5vw,24px); opacity:.5; margin-top:12px;">In attesa dello scadere del tempo...</p>' +
            '</div>';
    }

    socket.on('answer-result', ({ correct, points }) => {
        pendingResult = { correct, points };

        if (timeIsUp) {
            revealResult();
        }
    });

    function revealResult() {
        if (!pendingResult) return;

        const { correct, points } = pendingResult;
        const html = '<div style="grid-column:1/-1; display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:70vh; text-align:center; padding:16px;">' +
            '<div style="font-family:var(--font-display); font-size:clamp(36px,11vw,56px); color:' + (correct ? 'var(--green)' : 'var(--coral)') + '; margin-bottom:16px;">' +
            (correct ? 'Corretto!' : 'Sbagliato') +
            '</div>' +
            '<div style="font-family:var(--font-display); font-size:clamp(56px,20vw,96px); color:' + (correct ? 'var(--green)' : 'var(--coral)') + '; font-weight:700;">+' + points + ' punti</div>' +
            '</div>';
        document.getElementById('question').innerHTML = html;

        pendingResult = null;
    }

    socket.on('game-over', (leaderboard) => {
        clearInterval(playerCountdown);
        const html = '<div style="grid-column:1/-1; min-height:80vh; padding:20px; display:flex; flex-direction:column; align-items:center; justify-content:center;">' +
            '<h1 style="font-family:var(--font-display); font-size:clamp(50px,10vw,56px); text-align:center; margin-bottom:24px;">Partita finita!</h1>' +
            '<div style="width:100%; max-width:480px;">' +
            leaderboard.map((p, i) =>
                '<div class="leaderboard-row" style="padding:16px 20px;">' +
                '<span class="player-name" style="font-size:clamp(36px,4vw,24px);">' + (i + 1) + '. ' + p.nickname + '</span>' +
                '<span class="player-score" style="font-size:clamp(36px,4vw,24px);">' + p.score + '</span>' +
                '</div>'
            ).join('') +
            '</div>' +
            '</div>';
        document.getElementById('question').innerHTML = html;
    });

    socket.on('game-restarted', () => {
        clearInterval(playerCountdown);
        document.getElementById('question').innerHTML =
            '<div style="grid-column:1/-1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; min-height:60vh; padding:16px;">' +
            '<p style="font-size:clamp(30px,10vw,48px); opacity:.75; max-width:90%;">In attesa che l\'host inizi una nuova partita...</p>' +
            '</div>';
    });

    socket.on('game-stopped', () => {
        clearInterval(playerCountdown);
        document.getElementById('question').innerHTML =
            '<div style="grid-column:1/-1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; min-height:60vh; padding:16px;">' +
            '<p style="font-size:clamp(30px,10vw,48px); opacity:.75; max-width:90%;">In attesa che l\'host inizi una nuova partita...</p>' +
            '</div>';
    });

    socket.on('room-closed', () => {
        alert('L\'host ha chiuso la stanza');
        location.reload();
    });
</script>
</body>
</html>
