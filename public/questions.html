<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Aggiungi domande</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body style="background:var(--paper-dim);">
<div style="max-width:560px; margin:0 auto; padding:32px 20px;">
    <a href="/index.html"><button class="btn">← Torna alla home</button></a>

    <div class="card" style="margin-top:20px;">
        <h1 id="formTitle" style="font-family:var(--font-display); margin-top:0;">Aggiungi una domanda</h1>

        <label style="font-weight:600;">Tipo di domanda</label>
        <select id="questionType" onchange="toggleQuestionType()" style="width:100%; padding:12px; border-radius:var(--radius); border:2px solid var(--ink); margin:8px 0 16px; font-family:var(--font-body);">
            <option value="multiple">Risposta multipla</option>
            <option value="truefalse">Vero o Falso</option>
            <option value="image">Immagine</option>
        </select>

        <input id="questionInput" placeholder="Testo della domanda" style="width:100%; padding:12px; border-radius:var(--radius); border:2px solid var(--ink); margin-bottom:12px; font-family:var(--font-body);">

        <div id="imageUploadField" style="display:none; margin-bottom:12px;">
            <input type="file" id="imageInput" accept="image/*" onchange="previewImage()">
            <img id="imagePreview" style="max-width:100%; max-height:200px; margin-top:10px; display:none; border-radius:var(--radius);">
        </div>

        <div id="multipleOptions">
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;"><input type="radio" name="correctOption" value="0"><input id="option0" placeholder="Opzione 1" style="flex:1; padding:10px; border-radius:var(--radius); border:2px solid var(--coral);"></div>
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;"><input type="radio" name="correctOption" value="1"><input id="option1" placeholder="Opzione 2" style="flex:1; padding:10px; border-radius:var(--radius); border:2px solid var(--blue);"></div>
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;"><input type="radio" name="correctOption" value="2"><input id="option2" placeholder="Opzione 3" style="flex:1; padding:10px; border-radius:var(--radius); border:2px solid var(--amber);"></div>
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;"><input type="radio" name="correctOption" value="3"><input id="option3" placeholder="Opzione 4" style="flex:1; padding:10px; border-radius:var(--radius); border:2px solid var(--green);"></div>
            <p style="font-size:13px; opacity:.7;">Seleziona il pallino accanto alla risposta corretta</p>
        </div>

        <div id="trueFalseOptions" style="display:none; margin-bottom:12px;">
            <label style="display:block; margin-bottom:6px;"><input type="radio" name="tfCorrectOption" value="0"> Vero</label>
            <label style="display:block;"><input type="radio" name="tfCorrectOption" value="1"> Falso</label>
        </div>

        <input id="timeLimit" type="number" placeholder="Tempo limite (secondi)" value="10" style="width:100%; padding:12px; border-radius:var(--radius); border:2px solid var(--ink); margin-bottom:16px; font-family:var(--font-body);">

        <div style="display:flex; gap:12px;">
            <button class="btn btn-accent" onclick="saveQuestion()">Salva domanda</button>
            <button id="cancelBtn" class="btn" onclick="cancelEdit()" style="display:none;">Annulla modifica</button>
        </div>

        <p id="message" style="color:var(--coral); font-weight:600;"></p>
    </div>

    <h2 style="font-family:var(--font-display); margin-top:32px;">Domande salvate (<span id="questionCount">0</span>)</h2>
    <div style="display:flex; gap:12px; margin-bottom:16px;">
        <button class="btn" onclick="toggleAll(true)">Attiva tutte</button>
        <button class="btn" onclick="toggleAll(false)">Disattiva tutte</button>
    </div>
    <div id="questionList"></div>
</div>

<script>
    let editingId = null;
    let currentQuestions = [];
    let draggedId = null;

    function toggleQuestionType() {
        const type = document.getElementById('questionType').value;
        document.getElementById('multipleOptions').style.display = (type === 'multiple' || type === 'image') ? 'block' : 'none';
        document.getElementById('trueFalseOptions').style.display = (type === 'truefalse') ? 'block' : 'none';
        document.getElementById('imageUploadField').style.display = (type === 'image') ? 'block' : 'none';
    }

    async function saveQuestion() {
        const type = document.getElementById('questionType').value;
        const question = document.getElementById('questionInput').value.trim();
        const timeLimit = parseInt(document.getElementById('timeLimit').value);

        let options, correctIndex;

        if (type === 'truefalse') {
            options = ['Vero', 'Falso'];
            const selected = document.querySelector('input[name="tfCorrectOption"]:checked');
            correctIndex = selected ? parseInt(selected.value) : NaN;
        } else {
            options = [
                document.getElementById('option0').value.trim(),
                document.getElementById('option1').value.trim(),
                document.getElementById('option2').value.trim(),
                document.getElementById('option3').value.trim()
            ];
            const selected = document.querySelector('input[name="correctOption"]:checked');
            correctIndex = selected ? parseInt(selected.value) : NaN;
        }

        // NUOVO: per le domande immagine, serve una foto caricata
        if (type === 'image' && !currentImageData) {
            document.getElementById('message').innerText = 'Carica un\'immagine';
            return;
        }

        if (!question || options.some(o => !o) || isNaN(correctIndex) || isNaN(timeLimit)) {
            document.getElementById('message').innerText = 'Compila tutti i campi e seleziona la risposta corretta';
            return;
        }

        const questionData = { question, options, correctIndex, timeLimit };
        if (type === 'image') {
            questionData.imageData = currentImageData; // NUOVO
        }

        const body = JSON.stringify(questionData);

        if (editingId) {
            await fetch('/api/questions/' + editingId, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body
            });
            document.getElementById('message').innerText = 'Domanda modificata!';
            cancelEdit();
        } else {
            await fetch('/api/questions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body
            });
            document.getElementById('message').innerText = 'Domanda salvata!';
            clearForm();
        }

        loadQuestionList();
    }

    function clearForm() {
        document.getElementById('questionInput').value = '';
        document.getElementById('option0').value = '';
        document.getElementById('option1').value = '';
        document.getElementById('option2').value = '';
        document.getElementById('option3').value = '';
        document.getElementById('timeLimit').value = '15';
        document.getElementById('questionType').value = 'multiple';
        toggleQuestionType();

        document.querySelectorAll('input[name="correctOption"]').forEach(r => r.checked = false);
        document.querySelectorAll('input[name="tfCorrectOption"]').forEach(r => r.checked = false);
    }

    function editQuestion(id) {
        const q = currentQuestions.find(q => q.id === id);
        if (!q) return;

        editingId = q.id;
        document.getElementById('questionInput').value = q.question;
        document.getElementById('timeLimit').value = q.timeLimit;

        const isTrueFalse = q.options.length === 2 && q.options[0] === 'Vero' && q.options[1] === 'Falso';

        if (q.imageData) {
            // NUOVO: domanda di tipo immagine
            document.getElementById('questionType').value = 'image';
            toggleQuestionType();
            currentImageData = q.imageData;
            document.getElementById('imagePreview').src = q.imageData;
            document.getElementById('imagePreview').style.display = 'block';
            document.getElementById('option0').value = q.options[0];
            document.getElementById('option1').value = q.options[1];
            document.getElementById('option2').value = q.options[2];
            document.getElementById('option3').value = q.options[3];
            document.querySelectorAll('input[name="correctOption"]').forEach(r => {
                r.checked = (parseInt(r.value) === q.correctIndex);
            });
        } else if (isTrueFalse) {
            document.getElementById('questionType').value = 'truefalse';
            toggleQuestionType();
            document.querySelectorAll('input[name="tfCorrectOption"]').forEach(r => {
                r.checked = (parseInt(r.value) === q.correctIndex);
            });
        } else {
            document.getElementById('questionType').value = 'multiple';
            toggleQuestionType();
            document.getElementById('option0').value = q.options[0];
            document.getElementById('option1').value = q.options[1];
            document.getElementById('option2').value = q.options[2];
            document.getElementById('option3').value = q.options[3];
            document.querySelectorAll('input[name="correctOption"]').forEach(r => {
                r.checked = (parseInt(r.value) === q.correctIndex);
            });
        }

        document.getElementById('formTitle').innerText = 'Modifica domanda';
        document.getElementById('cancelBtn').style.display = 'inline-block';
    }

    function cancelEdit() {
        editingId = null;
        clearForm();
        document.getElementById('formTitle').innerText = 'Aggiungi una domanda';
        document.getElementById('cancelBtn').style.display = 'none';
    }

    async function deleteQuestion(id) {
        if (!confirm('Eliminare questa domanda?')) return;
        await fetch('/api/questions/' + id, { method: 'DELETE' });
        loadQuestionList();
    }

    async function loadQuestionList() {
        const res = await fetch('/api/questions');
        currentQuestions = await res.json();

        document.getElementById('questionCount').innerText = currentQuestions.filter(q => q.enabled !== false).length;

        document.getElementById('questionList').innerHTML = currentQuestions.map(q => {
            const isEnabled = q.enabled !== false; // NUOVO: attiva di default se il campo non esiste
            return '<div class="card" data-id="' + q.id + '" ' +
                'style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding:16px;' + (isEnabled ? '' : ' opacity:.5;') + '">' +
                '<span style="display:flex; align-items:center; gap:10px;">' +
                '<input type="checkbox" ' + (isEnabled ? 'checked' : '') + ' onchange="toggleEnabled(\'' + q.id + '\', this.checked)" style="width:20px; height:20px; cursor:pointer;">' +
                '<span draggable="true" class="drag-handle" style="cursor:grab; opacity:.4; font-size:20px; user-select:none;">☰</span>' +
                '<span>' + q.question + ' <strong style="color:var(--green);">(' + q.options[q.correctIndex] + ')</strong></span>' +
                '</span>' +
                '<span style="display:flex; gap:8px;">' +
                '<button class="btn" onclick="editQuestion(\'' + q.id + '\')">Modifica</button>' +
                '<button class="btn" onclick="deleteQuestion(\'' + q.id + '\')">Elimina</button>' +
                '</span>' +
                '</div>';
        }).join('');

        attachDragEvents();
    }

    async function toggleEnabled(id, enabled) {
        await fetch('/api/questions/' + id + '/toggle', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ enabled })
        });
        loadQuestionList(); // ricarica per aggiornare l'opacità e il conteggio
    }

    async function toggleAll(enabled) {
        // NUOVO: manda una richiesta di aggiornamento per ogni domanda, in parallelo
        await Promise.all(
            currentQuestions.map(q =>
                fetch('/api/questions/' + q.id + '/toggle', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled })
                })
            )
        );
        loadQuestionList();
    }

    let currentImageData = null; // NUOVO: qui teniamo l'immagine convertita in base64

    function previewImage() {
        const file = document.getElementById('imageInput').files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            currentImageData = e.target.result; // stringa base64 dell'immagine
            const preview = document.getElementById('imagePreview');
            preview.src = currentImageData;
            preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
    }

    function attachDragEvents() {
        const handles = document.querySelectorAll('.drag-handle');

        handles.forEach(handle => {
            const item = handle.closest('.card');

            handle.addEventListener('dragstart', () => {
                draggedId = item.dataset.id;
                item.style.opacity = '0.4';
            });

            handle.addEventListener('dragend', () => {
                item.style.opacity = '1';
            });
        });

        document.querySelectorAll('#questionList .card').forEach(item => {
            item.addEventListener('dragover', (e) => {
                e.preventDefault();
                const dragging = document.querySelector('[data-id="' + draggedId + '"]');
                if (dragging && dragging !== item) {
                    const rect = item.getBoundingClientRect();
                    const isAfter = e.clientY > rect.top + rect.height / 2;
                    item.parentNode.insertBefore(dragging, isAfter ? item.nextSibling : item);
                }
            });

            item.addEventListener('drop', async () => {
                const newOrder = Array.from(document.querySelectorAll('#questionList .card'))
                    .map(el => el.dataset.id);

                await fetch('/api/questions/reorder', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderedIds: newOrder })
                });
            });
        });
    }

    loadQuestionList();
</script>
</body>
</html>
