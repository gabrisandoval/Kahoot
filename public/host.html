<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HOST</title>
</head>
<body>
<h1>Crea una partita</h1>
<button onclick="createRoom()">Crea una stanza</button>
<h2 id="pin"></h2>
<p id="players"></p>
<button onclick="nextQuestion()">Invia prossima domanda</button>
<p id="answerCount"></p>
<div id="leaderboard"></div>
<button id="restartBtn" onclick="restartGame()" style="display:none;">Nuova partita</button>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let currentPin = null;

    function createRoom(){
        socket.emit('host-create-room');
    }

    socket.on('room-created', ({pin}) =>{
        currentPin = pin;
        document.getElementById('pin').innerText = 'PIN: ' + pin;
    });

    function nextQuestion() {
        socket.emit('host-next-question', { pin: currentPin });
    }

    socket.on('player-list-update', (players) => {
        document.getElementById('players').innerText = 'Giocatori: ' + players.join(', ');
    });

    socket.on('answer-count-update', ({ totalAnswers, totalPlayers }) => {
        document.getElementById('answerCount').innerText =
            'Risposte: ' + totalAnswers + '/' + totalPlayers;
    });

    socket.on('game-over', (leaderboard) => {
        const html = '<h2>Classifica finale</h2>' +
            leaderboard.map((p, i) =>
                '<p>' + (i + 1) + '. ' + p.nickname + ' — ' + p.score + ' punti</p>'
            ).join('');
        document.getElementById('leaderboard').innerHTML = html;
        document.getElementById('restartBtn').style.display = 'inline-block'; // NUOVO
    });

    function restartGame() { // NUOVO
        socket.emit('host-restart-game', { pin: currentPin });
    }

    socket.on('game-restarted', () => { // NUOVO
        document.getElementById('leaderboard').innerHTML = '';
        document.getElementById('restartBtn').style.display = 'none';
        document.getElementById('answerCount').innerText = '';
    });

</script>

</body>
</html>
