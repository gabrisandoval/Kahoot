<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Host</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="stage">

    <audio id="lobbyMusic" src="lobby.mp3" loop></audio>

    <div style="position:fixed; top:20px; right:20px; display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.1); padding:10px 16px; border-radius:var(--radius); z-index:10;">
        <button id="muteBtn" onclick="toggleMute()" style="background:none; border:none; color:var(--paper); font-size:24px; cursor:pointer; padding:0;">🔊</button>
        <input type="range" id="volumeSlider" min="0" max="100" value="50" oninput="setVolume(this.value)" style="width:100px;">
    </div>

    <h1 style="font-family:var(--font-display);">Lobby partita</h1>

    <div class="pin-display" id="pin"></div>

    <div style="display:flex; gap:24px; align-items:center; justify-content:center; flex-wrap:wrap; margin-top:16px;">
        <div style="display:flex; flex-direction:column; align-items:center; gap:12px;">
            <div id="qrcode" style="background:var(--paper); padding:12px; border-radius:var(--radius); display:inline-block;"></div>
        </div>

        <div style="display:flex; flex-direction:column; align-items:center; gap:12px;">
            <p style="margin:0; font-weight:600; opacity:.7;">Link per entrare</p>
            <button id="copyLinkBtn" class="btn btn-on-dark" onclick="copyLink()" style="display:none;">Copia link</button>
        </div>
    </div>

    <div style="display:flex; gap:12px; margin-top:20px;">
        <a href="/index.html"><button class="btn btn-on-dark" style="position:absolute; top:20px; left:20px;">← Home</button></a>
        <button id="lockBtn" class="btn btn-on-dark" onclick="toggleLock()">Blocca stanza</button>
        <button id="playBtn" class="btn btn-accent" onclick="openPlayScreen()" style="display:none;">GIOCA</button>
    </div>

    <div class="card" style="width:95%; max-width:900px; margin-top:20px; min-height:60px;">
        <p style="margin:0 0 12px; font-weight:600; opacity:.7;">Giocatori</p>
        <div id="players" style="display:flex; flex-wrap:wrap; gap:8px;">
            <p style="margin:0; opacity:.6;">Nessun giocatore ancora</p>
        </div>
    </div>


</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let currentPin = null;

    // NUOVO: se arriva un PIN nell'URL, ci ricolleghiamo a quella stanza invece di crearne una nuova
    const urlParams = new URLSearchParams(window.location.search);
    const pinFromUrl = urlParams.get('pin');

    socket.on('connect', () => {
        if (pinFromUrl) {
            socket.emit('host-rejoin', { pin: pinFromUrl });
        } else {
            socket.emit('host-create-room'); // NUOVO: creazione automatica, niente più bottone
        }
    });

    function setupRoomUI(pin) {
        currentPin = pin;
        document.getElementById('pin').innerText = pin;

        const joinUrl = window.location.origin + '/player.html?pin=' + pin + '&ngrok-skip-browser-warning=true';
        currentJoinUrl = joinUrl;

        document.getElementById('qrcode').innerHTML = '';
        new QRCode(document.getElementById('qrcode'), joinUrl);

        document.getElementById('copyLinkBtn').style.display = 'inline-block';
        document.getElementById('playBtn').style.display = 'inline-block';
    }

    socket.on('room-created', ({pin}) => {
        playLobbyMusic();
        setupRoomUI(pin);
    });

    // NUOVO: ripristina la UI quando torniamo alla lobby dopo un restart
    socket.on('host-rejoin-success', ({ pin, locked, players }) => {
        setupRoomUI(pin);
        document.getElementById('lockBtn').innerText = locked ? 'Sblocca stanza' : 'Blocca stanza';
        document.getElementById('players').innerText = 'Giocatori: ' + players.join(', ');
        playLobbyMusic()
    });

    function copyLink() {
        let currentJoinUrl = '';
        const link = document.getElementById(currentJoinUrl).innerText;
        navigator.clipboard.writeText(link).then(() => {
            document.getElementById('copyLinkBtn').innerText = 'Copiato!';
            setTimeout(() => {
                document.getElementById('copyLinkBtn').innerText = 'Copia link';
            }, 2000);
        });
    }

    function toggleLock() {
        socket.emit('host-toggle-lock', { pin: currentPin });
    }

    socket.on('lock-status-update', ({ locked }) => {
        document.getElementById('lockBtn').innerText = locked ? 'Sblocca stanza' : 'Blocca stanza';
    });

    let renderedPlayers = [];

    socket.on('player-list-update', (players) => {
        const playersContainer = document.getElementById('players');

        if (players.length === 0) {
            playersContainer.innerHTML = '<p style="margin:0; opacity:.6;">Nessun giocatore ancora</p>';
            renderedPlayers = [];
            return;
        }

        if (renderedPlayers.length === 0) {
            playersContainer.innerHTML = '';
        }

        // NUOVO: rimuove i rettangoli dei giocatori che non sono più connessi
        document.querySelectorAll('.player-chip').forEach(chip => {
            if (!players.includes(chip.dataset.nickname)) {
                chip.remove();
            }
        });

        // Aggiunge solo i rettangoli dei giocatori nuovi
        players.forEach(name => {
            if (!renderedPlayers.includes(name)) {
                const chip = document.createElement('div');
                chip.className = 'player-chip';
                chip.dataset.nickname = name;
                chip.innerText = name;
                playersContainer.appendChild(chip);
            }
        });

        renderedPlayers = players;
    });

    function playLobbyMusic() {
        const music = document.getElementById('lobbyMusic');
        music.currentTime = 0;
        music.volume = currentVolume;
        music.play().catch(err => console.log('Musica non avviata:', err));
    }

    function stopLobbyMusic() {
        const music = document.getElementById('lobbyMusic');
        music.pause();
        music.currentTime = 0;
    }

    let isMuted = false;
    let currentVolume = 0.5;

    function toggleMute() {
        const music = document.getElementById('lobbyMusic');
        isMuted = !isMuted;
        music.muted = isMuted;
        document.getElementById('muteBtn').innerText = isMuted ? '🔇' : '🔊';
    }

    function setVolume(value) {
        currentVolume = value / 100;
        document.getElementById('lobbyMusic').volume = currentVolume;

        if (currentVolume > 0 && isMuted) {
            isMuted = false;
            document.getElementById('lobbyMusic').muted = false;
            document.getElementById('muteBtn').innerText = '🔊';
        }
    }

    function openPlayScreen() {
        if (renderedPlayers.length === 0) {
            alert('Serve almeno un giocatore connesso per iniziare');
            return;
        }
        stopLobbyMusic();
        window.location.href = window.location.origin + '/play.html?pin=' + currentPin;
    }

</script>
</body>
</html>
